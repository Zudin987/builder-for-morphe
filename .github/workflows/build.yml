name: Build APKs
on:
  workflow_dispatch:
    inputs:
      patch_source:
        description: 'Select patch source'
        required: true
        default: 'morphe'
        type: choice
        options:
          - morphe
          - morphe-dev
          - piko
          - hoo-dles
          - paresh
          - rushi
          - de-vanced
          - anddea
          - hooman
          - metra
          - bufferk
          - xtra
      build_patch_apps:
        description: 'Build apps selected by the patch-source update logic'
        required: true
        type: boolean
        default: true
      target_apps:
        description: 'Optional JSON list of exact app IDs to build in addition'
        required: true
        type: string
        default: '[]'
      tolerate_stock_unavailable:
        description: 'Skip apps temporarily when no compatible stock APK can be downloaded'
        required: true
        type: boolean
        default: false
  workflow_call:
    inputs:
      patch_source:
        default: 'morphe'
        type: string
      filter_changelog:
        default: false
        type: boolean
      build_patch_apps:
        default: true
        type: boolean
      target_apps:
        default: '[]'
        type: string
      tolerate_stock_unavailable:
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      version: ${{ steps.version.outputs.version }}
      release_id: ${{ steps.version.outputs.release_id }}
      prerelease: ${{ steps.set-matrix.outputs.prerelease }}
    steps:
      - name: Checkout
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          git submodule update --init --recursive --depth=1

      - name: Install uv
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/uv-bin"
          curl --retry 6 --retry-all-errors --retry-delay 3 -LsSf https://astral.sh/uv/0.12.0/install.sh | env UV_UNMANAGED_INSTALL="$RUNNER_TEMP/uv-bin" sh
          echo "$RUNNER_TEMP/uv-bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Prepare clean draft release
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          source .github/scripts/gh_retry.sh

          VER="$(date +%y.%m.%d)-${{ inputs.patch_source }}"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

          # Remove stale duplicate release objects for today's source/tag.
          # Retry GitHub's API because transient 502/503 responses are common
          # during large workflow batches and should not fail a healthy APK build.
          RELEASES_JSON="$(gh_retry api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100")"
          mapfile -t OLD_RELEASE_IDS < <(
            jq -r --arg ver "$VER" '.[] | select(.tag_name == $ver) | .id' <<<"$RELEASES_JSON"
          )
          for release_id in "${OLD_RELEASE_IDS[@]:-}"; do
            [[ -n "$release_id" ]] || continue
            echo "Removing stale release object $release_id for $VER"
            gh_retry api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$release_id" >/dev/null
          done

          RESPONSE="$(gh_retry api --method POST "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$VER" -f name="$VER" -f body="" -F draft=true -F prerelease=false)"
          RELEASE_ID="$(jq -r '.id' <<<"$RESPONSE")"
          test -n "$RELEASE_ID"
          test "$RELEASE_ID" != "null"
          echo "release_id=${RELEASE_ID}" >> "$GITHUB_OUTPUT"
          echo "Prepared release $RELEASE_ID for $VER"

      - name: Set matrix based on patch source
        id: set-matrix
        env:
          FILTER_CHANGELOG: ${{ inputs.filter_changelog }}
          BUILD_PATCH_APPS: ${{ inputs.build_patch_apps }}
          TARGET_APPS: ${{ inputs.target_apps }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$BUILD_PATCH_APPS" == "true" ]]; then
            RESULT="$(uv run python -m src.scripts.matrix get-matrix '${{ inputs.patch_source }}')"
          else
            RESULT='{"include":[],"prerelease":false}'
          fi

          TARGETS="$(jq -c 'if type == "array" then unique else [] end' <<<"${TARGET_APPS:-[]}")"
          if [[ "$(jq 'length' <<<"$TARGETS")" -gt 0 ]]; then
            # Resolve the normal full matrix with changelog filtering disabled,
            # then keep only exact app IDs reported by the compatible-version watcher.
            ALL_RESULT="$(FILTER_CHANGELOG=false uv run python -m src.scripts.matrix get-matrix '${{ inputs.patch_source }}')"
            TARGET_RESULT="$(jq -c --argjson targets "$TARGETS" '
              {
                include: [.include[] | select(.id as $id | ($targets | index($id)) != null)],
                prerelease: (.prerelease // false)
              }
            ' <<<"$ALL_RESULT")"

            RESULT="$(jq -cn --argjson base "$RESULT" --argjson target "$TARGET_RESULT" '
              {
                include: (($base.include + $target.include) | unique_by([.id, (.arch // "")])),
                prerelease: (($base.prerelease // false) or ($target.prerelease // false))
              }
            ')"
          fi

          # Proton VPN's current Rushi patch is known to fail. Keep it out of CI
          # until its patch source is fixed, while allowing other Rushi apps such
          # as Waze to continue building normally.
          RESULT="$(jq 'if (.include | type) == "array" then .include |= map(select(.id != "Proton-VPN_rushi")) else . end' <<<"$RESULT")"

          echo "Selected app matrix: $(jq -c '.include' <<<"$RESULT")"
          echo "matrix=$(jq -c '{include}' <<<"$RESULT")" >> "$GITHUB_OUTPUT"
          echo "prerelease=$(jq -r '.prerelease // false' <<<"$RESULT")" >> "$GITHUB_OUTPUT"

  run:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          git submodule update --init --recursive --depth=1

      - name: Use preinstalled Java 21
        shell: bash
        run: |
          set -euo pipefail
          test -x "$JAVA_HOME_21_X64/bin/java"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          "$JAVA_HOME_21_X64/bin/java" -version

      - name: Install uv
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/uv-bin"
          curl --retry 6 --retry-all-errors --retry-delay 3 -LsSf https://astral.sh/uv/0.12.0/install.sh | env UV_UNMANAGED_INSTALL="$RUNNER_TEMP/uv-bin" sh
          echo "$RUNNER_TEMP/uv-bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Build APKs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          TOLERATE_STOCK_UNAVAILABLE: ${{ inputs.tolerate_stock_unavailable }}
        shell: bash
        run: bash .github/scripts/run_build_resilient.sh ${{ matrix.id }} ${{ matrix.arch }}

      - name: Upload APKs to exact draft release
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          source .github/scripts/gh_retry.sh

          shopt -s nullglob
          apks=(./build/*.apk)
          if [[ ${#apks[@]} -eq 0 ]]; then
            echo "No APKs to upload, skipping"
            exit 0
          fi

          upload_asset() {
            local file="$1"
            local name encoded existing_id
            name="$(basename "$file")"
            encoded="$(jq -rn --arg v "$name" '$v|@uri')"
            existing_id="$(gh_retry api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" \
              --jq ".[] | select(.name == \"$name\") | .id" | head -n1)"
            if [[ -n "$existing_id" ]]; then
              gh_retry api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$existing_id" >/dev/null
            fi
            curl --retry 8 --retry-all-errors --retry-delay 3 --fail-with-body -sS -L -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$file" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$encoded" >/dev/null
            echo "Uploaded $name"
          }

          for apk in "${apks[@]}"; do
            upload_asset "$apk"
          done

      - name: Upload build log to exact draft release
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          LABEL: ${{ matrix.id }}${{ matrix.arch && format('-{0}', matrix.arch) || '' }}
        shell: bash
        run: |
          set -euo pipefail
          source .github/scripts/gh_retry.sh

          [[ -f build.md && -s build.md ]] || exit 0
          file="build-${LABEL}.md"
          cp build.md "$file"
          encoded="$(jq -rn --arg v "$file" '$v|@uri')"
          existing_id="$(gh_retry api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" \
            --jq ".[] | select(.name == \"$file\") | .id" | head -n1)"
          if [[ -n "$existing_id" ]]; then
            gh_retry api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$existing_id" >/dev/null
          fi
          curl --retry 8 --retry-all-errors --retry-delay 3 --fail-with-body -sS -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@$file" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$encoded" >/dev/null

  release:
    needs: [prepare, run]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD

      - name: Install uv
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/uv-bin"
          curl --retry 6 --retry-all-errors --retry-delay 3 -LsSf https://astral.sh/uv/0.12.0/install.sh | env UV_UNMANAGED_INSTALL="$RUNNER_TEMP/uv-bin" sh
          echo "$RUNNER_TEMP/uv-bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check if any APKs were uploaded
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          source .github/scripts/gh_retry.sh
          has=$(gh_retry api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            --jq '[.assets[].name | select(endswith(".apk"))] | length > 0')
          echo "has_apks=${has}" >> "$GITHUB_OUTPUT"
          echo "Release has APKs: $has"

      - name: Keep APK builds private when explicitly disabled
        if: steps.check.outputs.has_apks == 'true' && vars.ALLOW_PUBLIC_APK_RELEASES == 'false'
        run: echo "::notice::APK build completed; release remains a draft because ALLOW_PUBLIC_APK_RELEASES=false."

      - name: Download and remove build logs
        if: steps.check.outputs.has_apks == 'true' && vars.ALLOW_PUBLIC_APK_RELEASES != 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          source .github/scripts/gh_retry.sh

          mkdir -p logs
          ASSETS_JSON="$(gh_retry api --paginate "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100")"
          while IFS=$'\t' read -r asset_id asset_name; do
            [[ -n "$asset_id" ]] || continue
            gh_retry api -H "Accept: application/octet-stream" \
              "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" > "logs/$asset_name"
            gh_retry api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" >/dev/null
          done < <(jq -r '.[] | select(.name | startswith("build-")) | [.id, .name] | @tsv' <<<"$ASSETS_JSON")

      - name: Combine logs and finalize release
        if: steps.check.outputs.has_apks == 'true' && vars.ALLOW_PUBLIC_APK_RELEASES != 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.version }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          source .github/scripts/gh_retry.sh

          if compgen -G 'logs/*.md' > /dev/null; then
            uv run python -m src.scripts.logs combine-logs logs | sed "s/{TAG}/$TAG/g" > final.md
          else
            printf 'Automated patched APK build.\n' > final.md
          fi
          gh_retry api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false \
            -F prerelease="$PRERELEASE" \
            -f name="$TAG" \
            -f body="$(cat final.md)" >/dev/null
          echo "Published $TAG"

      - name: Send Telegram notification
        if: steps.check.outputs.has_apks == 'true' && vars.ALLOW_PUBLIC_APK_RELEASES != 'false' && env.TG_TOKEN != '' && env.TG_CHAT != ''
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: uv run python -m src.scripts.telegram notify '${{ inputs.patch_source }}'

      - name: Delete empty draft if no APKs
        if: steps.check.outputs.has_apks != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        shell: bash
        run: |
          set +e
          for attempt in 1 2 3 4 5 6; do
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" && exit 0
            sleep $((attempt * 3))
          done
          exit 0
