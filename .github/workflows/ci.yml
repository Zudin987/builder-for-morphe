name: CI
on:
  push:
    branches: [main]
    paths:
      - 'config.toml'
      - '.github/workflows/**'
      - '.github/scripts/**'
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Build all apps (skip update check)'
        required: true
        type: boolean
        default: false

concurrency:
  group: morphe-ci
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  check-versions:
    runs-on: ubuntu-latest
    outputs:
      build_matrix: ${{ steps.get-matrix.outputs.build_matrix }}
    steps:
      - name: Checkout
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD

      - name: Use preinstalled Java 21
        shell: bash
        run: |
          set -euo pipefail
          test -x "$JAVA_HOME_21_X64/bin/java"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          "$JAVA_HOME_21_X64/bin/java" -version

      - name: Install uv
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/uv-bin"
          curl --retry 6 --retry-all-errors --retry-delay 3 -LsSf https://astral.sh/uv/0.12.0/install.sh | env UV_UNMANAGED_INSTALL="$RUNNER_TEMP/uv-bin" sh
          echo "$RUNNER_TEMP/uv-bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Get build matrix
        id: get-matrix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_UPDATE_WATCH_EXCLUDE: Proton-VPN_rushi
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.force_build }}" = "true" ]; then
            BRANDS="$(uv run python -m src.scripts.matrix get-matrix-force)"
            MATRIX="$(jq -cn --argjson brands "$BRANDS" '$brands | map({patch_source: ., filter_changelog: false})')"
          else
            # Keep upstream's patch-release detector untouched, then add a fork-only
            # watcher that resolves the version the current patches would actually
            # choose. A brand is rebuilt if either side says it needs attention.
            PATCH_BRANDS="$(uv run python -m src.scripts.matrix get-matrix)"
            APP_BRANDS="$(uv run python .github/scripts/check_app_updates.py)"
            MATRIX="$(jq -cn \
              --argjson patches "$PATCH_BRANDS" \
              --argjson apps "$APP_BRANDS" \
              '($patches + $apps | unique) as $all
               | $all
               | map(. as $brand | {
                   patch_source: $brand,
                   filter_changelog: (($apps | index($brand)) == null)
                 })')"
          fi

          echo "Resolved build matrix: $MATRIX"
          echo "build_matrix=$MATRIX" >> "$GITHUB_OUTPUT"

      - name: Notify skipped build
        if: steps.get-matrix.outputs.build_matrix == '[]'
        run: echo "::notice title=Build Skipped::No new patch or compatible app releases detected."

      - name: Clear older runs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run list -L400 --repo "$GITHUB_REPOSITORY" --json databaseId -q '.[].databaseId' | tail -n+91 | xargs -r -IID gh api "repos/$GITHUB_REPOSITORY/actions/runs/ID" -X DELETE || true

  build:
    needs: check-versions
    if: needs.check-versions.outputs.build_matrix != '[]' && needs.check-versions.outputs.build_matrix != ''
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.check-versions.outputs.build_matrix) }}
    uses: ./.github/workflows/build.yml
    with:
      patch_source: ${{ matrix.patch_source }}
      filter_changelog: ${{ matrix.filter_changelog }}
    secrets: inherit
