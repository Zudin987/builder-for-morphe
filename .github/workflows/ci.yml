name: CI
on:
  push:
    branches: [main]
    paths:
      - 'config.toml'
      - '.github/workflows/**'
      - '.github/scripts/**'
      - 'src/**'
      - 'main.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - 'sig.txt'
      - 'bin/**'
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Build all apps (skip update check)'
        required: true
        type: boolean
        default: false

concurrency:
  group: morphe-ci
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  check-versions:
    runs-on: ubuntu-latest
    outputs:
      build_matrix: ${{ steps.get-matrix.outputs.build_matrix }}
    steps:
      - name: Checkout
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD

      - name: Use preinstalled Java 21
        shell: bash
        run: |
          set -euo pipefail
          test -x "$JAVA_HOME_21_X64/bin/java"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          "$JAVA_HOME_21_X64/bin/java" -version

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.0"
          enable-cache: false

      - name: Install dependencies
        run: uv sync --frozen

      - name: Get build matrix
        id: get-matrix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_UPDATE_WATCH_EXCLUDE: Proton-VPN_rushi
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.force_build }}" = "true" ]; then
            BRANDS="$(uv run python -m src.scripts.matrix get-matrix-force)"
            MATRIX="$(jq -cn --argjson brands "$BRANDS" '
              $brands | map({
                patch_source: ., 
                build_patch_apps: true,
                filter_changelog: false,
                target_apps: []
              })
            ')"
          else
            # Patch releases stay brand-level because one patch release may affect
            # several apps. Compatible app-version changes are tracked by exact app
            # ID, so an update to Reddit does not rebuild YouTube/YT Music as well.
            PATCH_BRANDS="$(uv run python -m src.scripts.matrix get-matrix)"
            APP_UPDATES="$(uv run python .github/scripts/check_app_updates.py)"
            MATRIX="$(jq -cn \
              --argjson patches "$PATCH_BRANDS" \
              --argjson apps "$APP_UPDATES" \
              '($patches + ($apps | keys) | unique)
               | map(. as $brand | {
                   patch_source: $brand,
                   build_patch_apps: (($patches | index($brand)) != null),
                   filter_changelog: (($patches | index($brand)) != null),
                   target_apps: ($apps[$brand] // [])
                 })')"
          fi

          echo "Resolved build matrix: $MATRIX"
          echo "build_matrix=$MATRIX" >> "$GITHUB_OUTPUT"

      - name: Notify skipped build
        if: steps.get-matrix.outputs.build_matrix == '[]'
        run: echo "::notice title=Build Skipped::No new patch or compatible app releases detected."

      - name: Clear older runs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run list -L400 --repo "$GITHUB_REPOSITORY" --json databaseId -q '.[].databaseId' | tail -n+91 | xargs -r -IID gh api "repos/$GITHUB_REPOSITORY/actions/runs/ID" -X DELETE || true

  build:
    needs: check-versions
    if: needs.check-versions.outputs.build_matrix != '[]' && needs.check-versions.outputs.build_matrix != ''
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.check-versions.outputs.build_matrix) }}
    uses: ./.github/workflows/build.yml
    with:
      patch_source: ${{ matrix.patch_source }}
      build_patch_apps: ${{ matrix.build_patch_apps }}
      filter_changelog: ${{ matrix.filter_changelog }}
      target_apps: ${{ toJSON(matrix.target_apps) }}
      # This is the unattended/normal pipeline: a temporarily missing stock APK
      # should skip that app and be retried later, not turn the whole CI red.
      tolerate_stock_unavailable: true
    secrets: inherit
