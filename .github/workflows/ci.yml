name: CI
on:
  push:
    branches: [main]
    paths:
      - 'config.toml'
      - '.github/workflows/**'
      - '.github/scripts/**'
      - 'src/**'
      - 'main.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - 'sig.txt'
      - 'bin/**'
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Build all apps (skip update check)'
        required: true
        type: boolean
        default: false

concurrency:
  group: morphe-ci
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  check-versions:
    runs-on: ubuntu-latest
    outputs:
      build_matrix: ${{ steps.get-matrix.outputs.build_matrix }}
    steps:
      - name: Checkout
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD

      - name: Use preinstalled Java 21
        shell: bash
        run: |
          set -euo pipefail
          test -x "$JAVA_HOME_21_X64/bin/java"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          "$JAVA_HOME_21_X64/bin/java" -version

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.0"
          enable-cache: false

      - name: Install dependencies
        run: uv sync --frozen

      - name: Start Cloudflare challenge solver for version checks
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.force_build) }}
        shell: bash
        run: |
          set -uo pipefail
          # The app watcher also reads APKMirror pages, which can require the
          # same local solver already used in the APK build jobs.
          if ! docker run -d --name cf-solver -p 8000:8000 ghcr.io/sarperavci/cloudflarebypassforscraping:latest; then
            echo "::error::Cloudflare challenge solver could not start; refusing an incomplete app-version check."
            exit 1
          fi
          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:8000/docs >/dev/null; then
              echo "Cloudflare challenge solver is ready for version checks"
              exit 0
            fi
            sleep 2
          done
          docker logs cf-solver || true
          echo "::error::Cloudflare challenge solver did not become ready; refusing an incomplete app-version check."
          exit 1

      - name: Get build matrix
        id: get-matrix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_UPDATE_WATCH_EXCLUDE: Proton-VPN_rushi
          PUBLISH_BUILD_PUSH: ${{ startsWith(github.event.head_commit.message, '[publish builds]') }}
          PUBLISH_FIXES_PUSH: ${{ startsWith(github.event.head_commit.message, '[publish fixes]') }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$PUBLISH_BUILD_PUSH" = "true" ]; then
            # Only rebuild groups with a verified update path. Skip metra
            # because today's release already exists, piko because no newer
            # compatible X version is confirmed, and paresh because its patch
            # source is archived.
            BRANDS='["morphe","rushi","hooman","de-vanced","bufferk","xtra"]'
          elif [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$PUBLISH_FIXES_PUSH" = "true" ]; then
            # Refresh the maintained Waze source and current Brave patch bundle.
            # Brave's existing same-day release is reused for a guarded asset-only
            # hotfix; existing APKs are preserved.
            BRANDS='["rushi","bufferk"]'
          elif [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.force_build }}" = "true" ]; then
            BRANDS="$(uv run python -m src.scripts.matrix get-matrix-force)"
          else
            BRANDS=""
          fi

          if [ -n "$BRANDS" ]; then
            MATRIX="$(jq -cn --argjson brands "$BRANDS" '
              $brands | map({
                patch_source: .,
                build_patch_apps: true,
                filter_changelog: false,
                target_apps: []
              })
            ')"
          else
            # Scheduled runs rebuild only compatible app versions detected by
            # the patch-source and app-version watchers.
            PATCH_BRANDS="$(uv run python .github/scripts/check_patch_updates.py)"
            APP_UPDATES="$(uv run python .github/scripts/check_app_updates.py)"
            MATRIX="$(jq -cn \
              --argjson patches "$PATCH_BRANDS" \
              --argjson apps "$APP_UPDATES" \
              '($patches + ($apps | keys) | unique)
               | map(. as $brand | {
                   patch_source: $brand,
                   build_patch_apps: (($patches | index($brand)) != null),
                   filter_changelog: (($patches | index($brand)) != null),
                   target_apps: ($apps[$brand] // [])
                 })')"
          fi

          echo "Resolved build matrix: $MATRIX"
          echo "build_matrix=$MATRIX" >> "$GITHUB_OUTPUT"

      - name: Notify skipped build
        if: steps.get-matrix.outputs.build_matrix == '[]'
        run: echo "::notice title=Build Skipped::No new patch or compatible app releases detected."

      - name: Clear older runs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run list -L400 --repo "$GITHUB_REPOSITORY" --json databaseId -q '.[].databaseId' | tail -n+91 | xargs -r -IID gh api "repos/$GITHUB_REPOSITORY/actions/runs/ID" -X DELETE || true

  build:
    needs: check-versions
    if: needs.check-versions.outputs.build_matrix != '[]' && needs.check-versions.outputs.build_matrix != ''
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.check-versions.outputs.build_matrix) }}
    uses: ./.github/workflows/build.yml
    with:
      patch_source: ${{ matrix.patch_source }}
      build_patch_apps: ${{ matrix.build_patch_apps }}
      filter_changelog: ${{ matrix.filter_changelog }}
      target_apps: ${{ toJSON(matrix.target_apps) }}
      # This is the unattended/normal pipeline: a temporarily missing stock APK
      # should skip that app and be retried later, not turn the whole CI red.
      tolerate_stock_unavailable: true
    secrets: inherit
