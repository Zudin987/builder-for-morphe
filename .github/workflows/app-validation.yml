name: Requested app build verification
on:
  push:
    branches: [verify/speedtest-discord]
permissions:
  contents: read
jobs:
  build:
    name: Verify ${{ matrix.app }} (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: Speedtest-by-Ookla
            arch: arm64-v8a
          - app: Speedtest-by-Ookla
            arch: armeabi-v7a
          - app: Discord
            arch: arm64-v8a
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Use preinstalled Java 21
        shell: bash
        run: |
          set -euo pipefail
          test -x "$JAVA_HOME_21_X64/bin/java"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.0"
          enable-cache: false
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Start APKMirror helper
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name cf-solver -p 8000:8000 ghcr.io/sarperavci/cloudflarebypassforscraping:latest
          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:8000/docs >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs cf-solver
          exit 1
      - name: Build and verify requested app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: uv run python main.py '${{ matrix.app }}' '${{ matrix.arch }}'
      - name: Keep verified APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.app }}-${{ matrix.arch }}
          path: build/*.apk
          if-no-files-found: error
          retention-days: 7
