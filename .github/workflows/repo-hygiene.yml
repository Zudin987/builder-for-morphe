name: Repository hygiene

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Block generated APK/distribution output in source
        shell: bash
        run: |
          set -euo pipefail
          forbidden="$(git ls-files | grep -Ei '\.(apk|aab|apks|xapk|exe|msi|zip|7z|rar)$' || true)"
          if [[ -n "$forbidden" ]]; then
            echo "::error::Generated app/distribution files belong in draft Releases or build artifacts, not source."
            printf '%s\n' "$forbidden"
            exit 1
          fi

      - name: Block signing material and credential files
        shell: bash
        run: |
          set -euo pipefail
          forbidden="$(git ls-files | grep -Ei '(^|/)\.env($|\.)|\.(jks|keystore|pem|key|p12|pfx)$|(^|/)key\.properties$' || true)"
          if [[ -n "$forbidden" ]]; then
            echo "::error::Signing material or credentials must not be committed."
            printf '%s\n' "$forbidden"
            exit 1
          fi

      - name: Block obvious committed secret material
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nEI -- '-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}' -- . ':!.github/workflows/repo-hygiene.yml' 2>/dev/null; then
            echo "::error::Possible secret material detected in tracked source."
            exit 1
          fi

      - name: Verify public APK release remains explicit opt-in
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "vars.ALLOW_PUBLIC_APK_RELEASES == 'true'" .github/workflows/build.yml
          grep -Fq "vars.ALLOW_PUBLIC_APK_RELEASES != 'true'" .github/workflows/build.yml
