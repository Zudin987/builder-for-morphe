name: Sync upstream

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    name: Sync upstream

    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          fetch-tags: false

      - name: Check upstream
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          UPSTREAM_URL: ${{ vars.UPSTREAM_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$UPSTREAM_URL" ]]; then
            UPSTREAM_URL=$(gh api repos/${{ github.repository }} -q '.parent.html_url // "https://github.com/nvbangg/builder-for-morphe"')
          fi
          git remote add upstream "$UPSTREAM_URL"
          git fetch --no-tags upstream refs/heads/main:refs/remotes/upstream/main
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          git fetch --no-tags origin refs/heads/sync-upstream:refs/remotes/origin/sync-upstream || true

          if [[ "$(git rev-list --count origin/main..upstream/main)" -eq 0 ]]; then
            echo "::notice title=Sync upstream::There were no new commits."
            exit 0
          fi
          echo "HAS_CHANGES=true" >> "$GITHUB_OUTPUT"

      - name: Prepare reviewable upstream sync
        if: steps.check.outputs.HAS_CHANGES == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          IGNORE_SYNC_FILES: ${{ vars.IGNORE_SYNC_FILES }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Fork-owned policy and release automation are never replaced automatically.
          # Upstream executable/source changes are proposed through a PR so Repository
          # health checks run before they can reach main.
          IGNORE_LIST="config.toml sig.txt README.md .github/workflows .github/scripts tests ${IGNORE_SYNC_FILES:-}"

          git checkout -B sync-upstream origin/main
          MERGE_FAILED=false
          git merge --no-commit --no-ff -X theirs upstream/main || MERGE_FAILED=true

          for pattern in $IGNORE_LIST; do
            git checkout origin/main -- "$pattern" 2>/dev/null || true
            git add "$pattern" 2>/dev/null || true
          done

          if [[ "$MERGE_FAILED" == true ]] && [[ -n "$(git diff --name-only --diff-filter=U)" ]]; then
            echo "::error title=Sync Upstream::Unresolved non-policy conflicts require manual review."
            git diff --name-only --diff-filter=U
            exit 1
          fi

          git add -A
          if git diff --cached --quiet; then
            echo "::notice title=Sync upstream::Upstream changes only touched protected fork-owned files."
            exit 0
          fi
          git commit -m "Merge remote-tracking branch 'upstream/main'"

          if ! git push --force-with-lease -u origin sync-upstream; then
            echo "::error title=Sync Upstream Failed::A PAT with branch/workflow permission may be required."
            exit 1
          fi

          if [[ "$(gh pr list --repo ${{ github.repository }} --base main --head sync-upstream --state open --json number -q 'length')" -eq 0 ]]; then
            gh pr create \
              --repo ${{ github.repository }} \
              --base main \
              --head sync-upstream \
              --title "Sync Upstream" \
              --body "Automated upstream sync. Review and merge only after Repository health passes."
          else
            echo "::notice title=Sync upstream::Updated existing sync-upstream pull request."
          fi
